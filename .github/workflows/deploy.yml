# The name of your workflow
name: CI/CD Pipeline

on:
  push:
    # Trigger on push to main branch
    branches: [main]

jobs:
  build-and-test:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Pull the repo to the virtual machine (v4 is the current stable)
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js (v4 is the current stable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 or 22 is recommended for stability
          node-version: 22
          cache: "npm"

      # Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Run Vitest (must use 'vitest run' in your package.json)
      - name: Run tests
        run: npm run test

      # Create the production 'dist' folder
      - name: Build project
        run: npm run build
