# The name of your workflow
name: CI/CD Pipeline

on:
  push:
    # Trigger on push to main branch
    branches: [main]

jobs:
  build-and-test:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Pull the repo to the virtual machine (v4 is the current stable)
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js (v4 is the current stable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 or 22 is recommended for stability
          node-version: 22
          cache: "npm"

      # Install project dependencies
      - name: Install Dependencies
        run: npm install

      # Run Vitest (must use 'vitest run' in your package.json)
      - name: Run tests
        run: npm run test

      # Create the production 'dist' folder
      - name: Build project
        run: npm run build
  # This is our new Deployment job
  deploy:
    # This ensures deployment ONLY happens if build-and-test succeeds
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      # 1. We need to checkout the code again to get the files
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. We must build it again (or use artifacts) to get the 'dist' folder
      - name: Install and Build
        run: |
          npm install
          npm run build

      # 3. Use an Action to securely copy the 'dist' folder to EC2
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Source is the folder Vite creates
          source: "dist/*"
          # Target is where Nginx looks for website files
          target: "/var/www/html"
          # This removes the 'dist/' prefix so files land directly in /html
          strip_components: 1
